# ============================================================
# Test profile - H2 in-memory database.
#
# IMPORTANT CAVEAT: the actual Flyway migrations (V1-V3) use MySQL-specific
# SQL - JSON_OBJECT(), a GENERATED ... STORED column, ENGINE=InnoDB, and
# session variables (SET @var := ...) in V3's mock data. H2, even in
# MODE=MySQL, does not fully support all of that, so running these
# migrations as-is against H2 will likely fail partway through.
#
# This profile is left in place as the right SHAPE for fast, DB-less tests,
# but to actually get a working test database you have two real options:
#   1. Testcontainers with a real MySQL container (recommended - exercises
#      the actual migrations, catches MySQL-specific bugs H2 would hide).
#      Add the testcontainers-mysql dependency and point spring.datasource.url
#      at the container instead of this profile.
#   2. Write H2-safe equivalents of V1-V3 (drop JSON/GENERATED/session-var
#      usage) as a separate migration path used only under this profile.
#
# Note that the unit tests actually included in this project
# (RuleEngineServiceImplTest, ConditionEvaluatorTest) don't load the Spring
# context at all - they instantiate POJOs directly - so they need neither
# this profile nor a database. This profile only matters once you add
# @DataJpaTest / @SpringBootTest-style integration tests.
# ============================================================

spring.datasource.url=jdbc:h2:mem:renewal_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=test-only-secret-not-for-any-real-environment-0123456789
app.cors.allowed-origins=http://localhost:4200

logging.level.com.insurer.renewal=DEBUG
