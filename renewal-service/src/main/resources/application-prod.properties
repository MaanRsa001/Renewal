# ============================================================
# Prod profile - deliberately has almost no defaults of its own.
# Its job is to REMOVE the convenience defaults from application.properties
# and force every sensitive/environment-specific value to come from a real
# environment variable - a missing DB_PASSWORD or JWT_SECRET should fail
# startup loudly, not silently fall back to a checked-in placeholder.
# Activate with: SPRING_PROFILES_ACTIVE=prod (env var, not just a CLI flag,
# so it survives however the process is actually launched in your infra).
# ============================================================

# No ${VAR:default} fallback here on purpose - these MUST be supplied by the
# environment (secrets manager, k8s secret, etc.) or Spring fails to start.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.insurer.renewal=INFO

# Keep actuator locked down in prod - health only, no details, no other endpoints.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Fail fast if a Flyway migration is missing/out of order rather than limping on.
spring.flyway.baseline-on-migrate=false
