# ============================================================
# Dev profile - local development against a local MySQL instance.
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# or:            java -jar renewal-service.jar --spring.profiles.active=dev
# ============================================================

# Verbose SQL logging is genuinely useful locally - never turn this on in prod,
# it leaks bind values (including PII) into logs.
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Loosen CORS to the default Angular dev server without needing an env var.
app.cors.allowed-origins=http://localhost:4200

# Surface full health details locally (DB status, disk space, etc.).
management.endpoint.health.show-details=always
