spring.application.name=renewal-service
server.port=${SERVER_PORT:8080}

# =========================
# MySQL Datasource
# =========================
spring.datasource.url=jdbc:mysql://192.168.1.9:3306/ewayglobal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=MSDB
spring.datasource.password=Admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# Hikari Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000

# =========================
# Disable Flyway
# =========================
spring.flyway.enabled=false


# =========================
# JWT
# =========================
app.jwt.secret=your-super-secret-key-that-is-at-least-32-characters-long
app.jwt.expiration-minutes=10080

# =========================
# CORS
# =========================
app.cors.allowed-origins=http://localhost:4200,http://192.168.1.8:8080,http://192.168.1.18:4500
#app.security.enabled=true
